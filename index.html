
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>My Video Player</title>
  <style>
    body {
      background: #121212;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    iframe {
      width: 100%;
      max-width: 720px;
      aspect-ratio: 16 / 9;
      border: none;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <h1>My Video Player</h1>
  <p>お気に入りの動画を再生</p>

  <iframe
    src="https://www.youtube.com/embed/M7lc1UVf-VE"
    title="YouTube Player"
    allow="accelerometer; autoplay; encrypted-media;
           gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>
</body>
</html>
